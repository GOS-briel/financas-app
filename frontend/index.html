<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Finanças</title>

  <!-- Ícones: Tabler via webfont (ADR-026) -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.51.0/tabler-icons.min.css"
        integrity="sha512-rNRApBa8uVGZdkCyRt5p1VKY6XlAN5iXbKtJfpMassLFruWL5L/IOJmA5jFPU7R/HgVK9+Th0rUiPTFRYss4pg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">

  <!-- Ordem importa: nossos scripts registram store e telas no evento
       alpine:init; o Alpine vem POR ÚLTIMO e se inicializa sozinho
       (a versão CDN não deve receber Alpine.start() manual). -->
  <script defer src="js/api.js"></script>
  <script defer src="js/util/formatadores.js"></script>
  <script defer src="js/util/mascara.js"></script>
  <script defer src="js/telas/dashboard.js"></script>
  <script defer src="js/telas/registrar.js"></script>
  <script defer src="js/telas/tetos.js"></script>
  <script defer src="js/telas/historico.js"></script>
  <script defer src="js/telas/importar.js"></script>
  <script defer src="js/app.js"></script>
  <script defer
          src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.17.5/cdn.min.js"
          integrity="sha512-6KnFhHgmSX+kDsTz55gSTvN6Q7LnjIregXoc1Tz/wvv2TLjJQ41zneZbAiHogivc0Q71Tv1OLxK9GDRjZQyscQ=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body x-data>
  <div class="faixa-erro" role="alert" x-show="$store.app.erroApi" x-text="$store.app.erroApi" x-cloak></div>

  <main class="conteudo">
    <!-- SPA: as 4 telas ficam no mesmo HTML; o store decide qual aparece -->
    <section class="tela" x-data="dashboard" x-show="$store.app.telaAtiva === 'dashboard'" x-cloak>
      <!-- Cabeçalho: saudação + navegação de mês (store compartilhado, ADR-027 A) -->
      <header class="dash-cabecalho">
        <p class="texto-secundario">Olá, <span x-text="nomeUsuario"></span></p>
        <div class="dash-mes">
          <button type="button" class="botao-icone" aria-label="Mês anterior" @click="mesAnterior()">
            <i class="ti ti-chevron-left" aria-hidden="true"></i>
          </button>
          <h1 x-text="rotuloMes" aria-live="polite"></h1>
          <button type="button" class="botao-icone" aria-label="Próximo mês" @click="proximoMes()">
            <i class="ti ti-chevron-right" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <div class="faixa-mes" x-show="posicaoMesExibido !== 0">
        <span x-text="posicaoMesExibido < 0 ? 'Mês encerrado' : 'Mês futuro'"></span>
        <button type="button" class="botao-link" @click="voltarParaHoje()">Voltar para hoje</button>
      </div>

      <!-- Estados (ADR-027 D) -->
      <p class="texto-secundario" x-show="primeiraCarga">Carregando…</p>

      <div class="dash-erro" x-show="erro && !carregando">
        <button type="button" class="botao-secundario" @click="tentarDeNovo()">
          <i class="ti ti-refresh" aria-hidden="true"></i> Tentar de novo
        </button>
      </div>

      <template x-if="dados">
        <div class="dash-conteudo" :class="{ 'atualizando': atualizando }" :aria-busy="carregando">

          <!-- Hero (ADR-027 B) -->
          <article class="cartao hero">
            <template x-if="!semTetos">
              <div class="hero__corpo">
                <p class="hero__valores">
                  <span class="numero hero__gasto" x-text="formatar.dinheiro(dados.hero.gasto_com_teto)"></span>
                  <span class="texto-secundario">de <span class="numero" x-text="formatar.dinheiro(dados.hero.total_teto)"></span></span>
                </p>
                <div class="barra" role="progressbar" aria-label="Uso do orçamento" aria-valuemin="0" aria-valuemax="100"
                     :aria-valuenow="Math.floor(dados.hero.percentual_uso)">
                  <div class="barra__preenchimento" :class="classeStatus(dados.hero.status)"
                       :style="`width: ${largura(dados.hero.percentual_uso, dados.hero.status)}%`"></div>
                </div>
                <p class="texto-secundario">
                  <span class="numero" x-text="formatar.percentual(dados.hero.percentual_uso)"></span> do orçamento ·
                  <span x-text="textoPrazo"></span>
                </p>
                <!-- Tetos parciais: o total real nunca some -->
                <dl class="hero__extras" x-show="dados.hero.gasto_sem_teto > 0">
                  <div>
                    <dt>Em categorias sem teto</dt>
                    <dd class="numero" x-text="`+ ${formatar.dinheiro(dados.hero.gasto_sem_teto)}`"></dd>
                  </div>
                  <div>
                    <dt>Total do mês</dt>
                    <dd class="numero" x-text="formatar.dinheiro(dados.hero.total_gasto)"></dd>
                  </div>
                </dl>
              </div>
            </template>
            <template x-if="semTetos">
              <div class="hero__corpo">
                <p class="texto-secundario">Total do mês</p>
                <p class="numero hero__gasto" x-text="formatar.dinheiro(dados.hero.total_gasto)"></p>
                <p class="texto-secundario" x-text="textoPrazo"></p>
              </div>
            </template>
          </article>

          <div class="cartao convite" x-show="semTetos">
            <p>Defina tetos por categoria para saber se está no controle.</p>
            <button type="button" class="botao-secundario" @click="$store.app.mostrarTela('tetos')">Definir tetos</button>
          </div>

          <p class="dash-vazio" x-show="mesVazio">
            Nenhum gasto em <span x-text="rotuloMesDosDados"></span> ainda. Toque no + para registrar.
          </p>

          <!-- Categorias (ADR-027 C), na ordem do backend (ADR-023) -->
          <section class="dash-secao" x-show="categoriasVisiveis.length > 0" aria-labelledby="titulo-categorias">
            <h2 id="titulo-categorias">Categorias</h2>
            <ul class="lista-categorias">
              <template x-for="c in categoriasVisiveis" :key="chave(c)">
                <li class="categoria" :style="estiloCategoria(c)">
                  <div class="categoria__linha">
                    <span class="categoria__nome" x-text="nomeCategoria(c)"></span>
                    <span class="numero categoria__valor" x-text="valorCategoria(c)"></span>
                  </div>
                  <template x-if="c.teto !== null">
                    <div class="barra barra--mini" role="progressbar" :aria-label="`Uso do teto de ${nomeCategoria(c)}`"
                         aria-valuemin="0" aria-valuemax="100" :aria-valuenow="Math.floor(c.percentual ?? 100)">
                      <div class="barra__preenchimento" :class="classeStatus(c.status)"
                           :style="`width: ${largura(c.percentual, c.status)}%`"></div>
                    </div>
                  </template>
                  <p class="categoria__estouro numero" x-show="c.status === 'estourado'" x-text="textoEstouro(c)"></p>
                </li>
              </template>
            </ul>
          </section>

          <div class="dash-recolhidas" x-show="!mesVazio && categoriasRecolhidas.length > 0">
            <button type="button" class="botao-recolhidas" :aria-expanded="mostrarRecolhidas.toString()"
                    @click="mostrarRecolhidas = !mostrarRecolhidas">
              <span x-text="rotuloRecolhidas"></span>
              <i class="ti" :class="mostrarRecolhidas ? 'ti-chevron-up' : 'ti-chevron-down'" aria-hidden="true"></i>
            </button>
            <ul class="lista-recolhidas texto-secundario" x-show="mostrarRecolhidas">
              <template x-for="c in categoriasRecolhidas" :key="chave(c)">
                <li x-text="nomeCategoria(c)"></li>
              </template>
            </ul>
          </div>

          <!-- Últimos lançamentos -->
          <section class="dash-secao" x-show="dados.ultimos_lancamentos.length > 0" aria-labelledby="titulo-ultimos">
            <h2 id="titulo-ultimos">Últimos lançamentos</h2>
            <ul class="lista-lancamentos">
              <template x-for="l in dados.ultimos_lancamentos" :key="l.id">
                <li class="lancamento">
                  <div class="lancamento__texto">
                    <p class="lancamento__descricao" x-text="l.descricao"></p>
                    <p class="texto-secundario">
                      <span class="numero" x-text="formatar.dataCurta(l.data)"></span> ·
                      <span x-text="l.subcategoria_nome ?? 'Sem categoria'"></span>
                    </p>
                  </div>
                  <span class="numero lancamento__valor" x-text="formatar.dinheiro(l.valor)"></span>
                </li>
              </template>
            </ul>
          </section>
        </div>
      </template>
    </section>

    <section class="tela" x-data="registrar" x-show="$store.app.telaAtiva === 'registrar'" x-cloak>
      <h1>Registrar gasto</h1>

      <!-- Sem categorias não dá para salvar: carregando ou erro (ADR-027 D) -->
      <p class="texto-secundario" x-show="semCategorias && $store.app.carregando">Carregando categorias…</p>
      <div class="dash-erro" x-show="semCategorias && !$store.app.carregando">
        <p class="texto-secundario">Não foi possível carregar as categorias.</p>
        <button type="button" class="botao-secundario" @click="$store.app.carregarDadosBase()">
          <i class="ti ti-refresh" aria-hidden="true"></i> Tentar de novo
        </button>
      </div>

      <form class="registrar" novalidate @submit.prevent="salvar()">
        <!-- Valor: máscara de centavos só pelo evento input (ADR-028) -->
        <label for="registrar-valor" class="oculto-visualmente">Valor</label>
        <input id="registrar-valor" x-ref="valor" class="campo-valor numero" type="text"
               inputmode="numeric" autocomplete="off" placeholder="R$ 0,00"
               @input="aoDigitarValor($event)" @focus="cursorNoFim()" @click="cursorNoFim()">

        <fieldset class="registrar__grupo" x-show="!semCategorias">
          <legend>Categoria</legend>
          <div class="grade-macros">
            <template x-for="m in macros" :key="m.id">
              <button type="button" class="macro" :aria-pressed="(macroId === m.id).toString()"
                      @click="escolherMacro(m.id)">
                <i class="ti" :class="icone(m.id)" aria-hidden="true"></i>
                <span x-text="m.nome"></span>
              </button>
            </template>
          </div>
        </fieldset>

        <fieldset class="registrar__grupo" x-show="macroSelecionada">
          <legend>Subcategoria</legend>
          <div class="pills">
            <template x-for="s in subcategorias" :key="s.id">
              <button type="button" class="pill" :aria-pressed="(subId === s.id).toString()"
                      @click="escolherSub(s.id)" x-text="s.nome"></button>
            </template>
            <button type="button" class="pill pill--icone" x-show="!criando" @click="abrirCriacao()"
                    :aria-label="`Criar subcategoria em ${macroSelecionada?.nome ?? ''}`">
              <i class="ti ti-plus" aria-hidden="true"></i>
            </button>
          </div>

          <div class="criar-sub" x-show="criando">
            <input type="text" class="campo" x-ref="novoNome" x-model="nomeNovo" maxlength="50"
                   :aria-label="`Nome da nova subcategoria em ${macroSelecionada?.nome ?? ''}`"
                   placeholder="Nome da subcategoria"
                   @keydown.enter.prevent="criarSub()" @keydown.escape.prevent="fecharCriacao()">
            <button type="button" class="botao-secundario" :disabled="criandoEnviando" @click="criarSub()">
              Criar e usar
            </button>
            <button type="button" class="botao-link" x-show="subcategorias.length > 0" @click="fecharCriacao()">
              Cancelar
            </button>
          </div>
          <p class="erro-campo" role="alert" x-show="erroCriar" x-text="erroCriar"></p>
          <p class="texto-secundario texto-pequeno" aria-live="polite" x-text="mensagemSub"></p>
        </fieldset>

        <fieldset class="registrar__grupo">
          <legend>Data</legend>
          <div class="pills">
            <button type="button" class="pill" :aria-pressed="(opcaoData === 'hoje').toString()"
                    @click="escolherData('hoje')">Hoje</button>
            <button type="button" class="pill" :aria-pressed="(opcaoData === 'ontem').toString()"
                    @click="escolherData('ontem')">Ontem</button>
            <button type="button" class="pill" :aria-pressed="(opcaoData === 'outra').toString()"
                    @click="escolherData('outra')">Outra data</button>
          </div>
          <input type="date" class="campo" x-ref="dataOutra" x-show="opcaoData === 'outra'"
                 aria-label="Data do gasto" x-model="dataOutra" :min="minimoIso" :max="hojeIso">
        </fieldset>

        <label class="registrar__campo">
          <span>Descrição <span class="texto-secundario">(opcional)</span></span>
          <input type="text" class="campo" x-model="descricao" maxlength="200" autocomplete="off"
                 :placeholder="subSelecionada ? subSelecionada.nome : 'Usa o nome da subcategoria'">
        </label>

        <button type="button" class="pill pill--texto" x-show="!mostrarNota"
                @click="abrirNota()">
          <i class="ti ti-note" aria-hidden="true"></i> Adicionar nota
        </button>
        <label class="registrar__campo" x-show="mostrarNota">
          <span>Nota <span class="texto-secundario">(opcional)</span></span>
          <textarea class="campo" x-ref="nota" x-model="nota" maxlength="500" rows="2"></textarea>
        </label>

        <p class="erro-campo" role="alert" x-show="erro" x-text="erro"></p>

        <button type="submit" class="botao-primario" :disabled="!podeSalvar"
                aria-describedby="registrar-falta" x-text="enviando ? 'Salvando…' : 'Salvar gasto'"></button>
        <p id="registrar-falta" class="texto-secundario texto-pequeno registrar__falta" x-text="faltando"></p>
      </form>
    </section>

    <section class="tela" x-data="tetos" x-show="$store.app.telaAtiva === 'tetos'" x-cloak>
      <!-- Mesmo mês do store que o Dashboard (ADR-029 B) -->
      <header class="dash-cabecalho">
        <p class="texto-secundario">Tetos por categoria</p>
        <div class="dash-mes">
          <button type="button" class="botao-icone" aria-label="Mês anterior" @click="irParaMes(-1)">
            <i class="ti ti-chevron-left" aria-hidden="true"></i>
          </button>
          <h1 x-text="rotuloMes" aria-live="polite"></h1>
          <button type="button" class="botao-icone" aria-label="Próximo mês" @click="irParaMes(1)">
            <i class="ti ti-chevron-right" aria-hidden="true"></i>
          </button>
        </div>
      </header>
      <p class="texto-secundario">Um teto vale para os meses seguintes até você mudar.</p>

      <!-- Alterações não salvas ao tentar sair (sem confirm do navegador) -->
      <div class="faixa-pendente" role="status" x-show="$store.app.navegacaoPendente">
        <strong x-text="textoPendentes"></strong>
        <div class="faixa-pendente__acoes">
          <button type="button" class="botao-link" :disabled="salvando" @click="salvar()">Salvar e continuar</button>
          <button type="button" class="botao-link" :disabled="salvando" @click="descartar()">Descartar</button>
          <button type="button" class="botao-icone" aria-label="Continuar editando"
                  @click="$store.app.cancelarNavegacao()">
            <i class="ti ti-x" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <p class="texto-secundario" x-show="primeiraCarga">Carregando…</p>
      <div class="dash-erro" x-show="erro && !carregando">
        <button type="button" class="botao-secundario" @click="carregar()">
          <i class="ti ti-refresh" aria-hidden="true"></i> Tentar de novo
        </button>
      </div>

      <form class="tetos" novalidate x-show="linhas.length > 0" :class="{ 'atualizando': atualizando }"
            :aria-busy="carregando" @submit.prevent="salvar()">
        <ul class="lista-tetos">
          <template x-for="l in linhas" :key="l.id">
            <li class="teto" :class="classeLinha(l)">
              <div class="teto__linha">
                <label class="teto__nome" :for="`teto-${l.id}`" x-text="l.nome"></label>
                <input :id="`teto-${l.id}`" class="campo teto__campo numero" type="text" inputmode="numeric"
                       autocomplete="off" placeholder="Sem teto" :value="textoCampo(l)"
                       :disabled="l.voltarAHerdar || salvando"
                       @input="aoDigitar(l, $event)" @blur="aoSair(l, $event)"
                       @focus="mascaraCentavos.cursorNoFim($event.target)"
                       @click="mascaraCentavos.cursorNoFim($event.target)">
              </div>
              <p class="teto__contexto texto-pequeno" x-text="contexto(l)"></p>
              <p class="teto__marca texto-pequeno" x-show="alterada(l)">
                <span x-text="l.voltarAHerdar ? 'Volta a herdar ao salvar' : 'Alterado'"></span>
                <button type="button" class="botao-link" x-show="l.voltarAHerdar"
                        @click="desfazerVoltarAHerdar(l)">Desfazer</button>
              </p>
              <button type="button" class="botao-link texto-pequeno teto__herdar" x-show="podeVoltarAHerdar(l)"
                      @click="voltarAHerdar(l)">Voltar a herdar</button>
              <p class="erro-campo" role="alert" x-show="l.erro" x-text="`Não salvou: ${l.erro}`"></p>
            </li>
          </template>
        </ul>

        <div class="tetos__acoes">
          <p class="texto-pequeno" aria-live="polite" x-text="mensagem"></p>
          <button type="submit" class="botao-primario" :disabled="quantidadeAlterada === 0 || salvando"
                  x-text="textoBotao"></button>
          <button type="button" class="botao-link texto-pequeno" x-show="quantidadeAlterada > 0 && !salvando"
                  @click="descartar()">Descartar alterações</button>
        </div>
      </form>
    </section>

    <section class="tela" x-data="historico" x-show="$store.app.telaAtiva === 'historico'" x-cloak>
      <h1>Histórico - em construção</h1>
    </section>

    <section class="tela" x-data="importar" x-show="$store.app.telaAtiva === 'importar'" x-cloak>
      <h1>Importar - em construção</h1>
    </section>
  </main>

  <!-- Aviso global (ex.: "Gasto salvo · Desfazer"). A região aria-live fica
       sempre no DOM para o leitor de tela anunciar quando o texto aparecer. -->
  <div class="aviso-regiao" role="status" aria-live="polite">
    <template x-if="$store.app.aviso">
      <div class="aviso">
        <span x-text="$store.app.aviso.texto"></span>
        <button type="button" class="aviso__acao" x-show="$store.app.aviso.lancamentoId"
                :disabled="$store.app.desfazendo" @click="$store.app.desfazerAviso()">Desfazer</button>
      </div>
    </template>
  </div>

  <nav class="barra-inferior" aria-label="Navegação principal">
    <button type="button" class="barra-inferior__item" aria-label="Dashboard"
            :class="{ 'ativo': $store.app.telaAtiva === 'dashboard' }"
            :aria-current="$store.app.telaAtiva === 'dashboard' ? 'page' : null"
            @click="$store.app.mostrarTela('dashboard')">
      <i class="ti ti-home" aria-hidden="true"></i>
    </button>

    <button type="button" class="barra-inferior__item" aria-label="Histórico"
            :class="{ 'ativo': $store.app.telaAtiva === 'historico' }"
            :aria-current="$store.app.telaAtiva === 'historico' ? 'page' : null"
            @click="$store.app.mostrarTela('historico')">
      <i class="ti ti-history" aria-hidden="true"></i>
    </button>

    <button type="button" class="barra-inferior__mais" aria-label="Registrar lançamento"
            :aria-current="$store.app.telaAtiva === 'registrar' ? 'page' : null"
            @click="$store.app.mostrarTela('registrar')">
      <i class="ti ti-plus" aria-hidden="true"></i>
    </button>

    <button type="button" class="barra-inferior__item" aria-label="Importar fatura"
            :class="{ 'ativo': $store.app.telaAtiva === 'importar' }"
            :aria-current="$store.app.telaAtiva === 'importar' ? 'page' : null"
            @click="$store.app.mostrarTela('importar')">
      <i class="ti ti-upload" aria-hidden="true"></i>
    </button>

    <button type="button" class="barra-inferior__item" aria-label="Tetos por categoria" title="Tetos por categoria"
            :class="{ 'ativo': $store.app.telaAtiva === 'tetos' }"
            :aria-current="$store.app.telaAtiva === 'tetos' ? 'page' : null"
            @click="$store.app.mostrarTela('tetos')">
      <i class="ti ti-settings" aria-hidden="true"></i>
    </button>
  </nav>
</body>
</html>
